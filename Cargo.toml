[package]
name = "cutup-studio"
version = "0.1.0"
edition = "2024"
description = "A local, metadata-first sketchpad for cut-up video compositions"
license = "MIT"

[dependencies]
eframe = { version = "0.32", default-features = true }
egui_extras = { version = "0.32", features = ["svg"] }
rfd = "0.15"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
